plugins {
    id 'com.android.application'
}

android {
    namespace = 'dev.dualterm'
    compileSdk 36
    // 固定 NDK 版本：CI 与本地装同一套，避免"AGP 默认 NDK"随插件版本漂移。
    // r28 起默认按 16KB 页对齐链接（Android 15+ 的 16KB 页设备需要）。
    ndkVersion = '28.2.13676358'

    // 发布时由 CI 按 tag 推导（v3.5.0 → versionCode 30500）；本地不设就走默认值
    def dtVersionName = System.getenv('DT_VERSION_NAME')
    def dtVersionCode = System.getenv('DT_VERSION_CODE')

    defaultConfig {
        applicationId 'dev.dualterm'
        minSdk 26
        targetSdk 36
        versionCode dtVersionCode ? dtVersionCode.toInteger() : 31100
        versionName dtVersionName ?: '3.11.0'
        // 需要 NDK：首次 Sync 时 Android Studio 会提示安装 NDK + CMake，直接同意即可。
        // 若要指定版本，取消下一行注释并改成你已安装的版本。
        // ndkVersion '28.2.13676358'
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=none'
                cFlags '-O2'
            }
        }
    }

    // 发布流水线只需要可复现地产出 APK；lint 在本地按需跑（./gradlew lint）。
    // 否则 assembleRelease 会额外拉 lint-gradle，离线构建直接失败。
    lint {
        checkReleaseBuilds = false
        abortOnError = false
    }

    // 仓库里自带的是"测试签名"（等同 debug key，密码公开），只为让 Release 开箱能装、
    // 能覆盖升级。正式分发请用环境变量换成自己的 keystore（见 README「发布」一节）。
    signingConfigs {
        release {
            def ks = System.getenv('DT_KEYSTORE')
            storeFile ks ? file(ks) : new File(rootDir, 'keystore/dualterm-test.jks')
            storePassword System.getenv('DT_STORE_PASSWORD') ?: 'dualterm'
            keyAlias System.getenv('DT_KEY_ALIAS') ?: 'dualterm'
            keyPassword System.getenv('DT_KEY_PASSWORD') ?: 'dualterm'
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            // 旁路包：debug 变体装成 dev.dualterm.debug，与正式签名包并存，
            // 用于实机取证/回归，不用卸载正式包
            applicationIdSuffix '.debug'
        }
        release {
            // 零依赖后 dex 本身只有几百 KB，开不开 R8 差不了多少；仍保留压缩，
            // 因为 R8 顺带做常量折叠与无用代码剥离，且资源收缩能剔掉未引用的
            // 颜色/字符串。代码里没有反射，唯一必须保留的是 JNI 入口（见
            // proguard-rules.pro）。
            minifyEnabled true
            shrinkResources true
            signingConfig = signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version = '3.22.1'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // AGP 8.x 里 packagingOptions 是旧名，8.13 起统一用 packaging。
    packaging {
        // 必须解压到 nativeLibraryDir：proot 是从 jniLibs 里以 libproot.so 形式
        // 打包的可执行文件，只能从磁盘上 exec，APK 内部的压缩条目无法执行。
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

dependencies {
    // 故意留空：整个 App 只用 Framework API。
    //
    // 2026-11-28 曾引入 appcompat / recyclerview / material 做容器面板（分段页签 +
    // RecyclerView + BottomSheetDialog），实测只有「局部取用」：appcompat 只用了
    // ContextThemeWrapper 一个类（Framework 有同名的），recyclerview 只服务一个
    // 十来条的列表，material 只用了 MaterialButton/MaterialButtonToggleGroup 两个
    // 控件。按「必须对库有深度使用需求，不能只取部分能力」的准入规则，这三个都
    // 不合格：不开压缩时 APK 5.6MB，开 R8 后 1.9MB，换来的只有一个面板的控件。
    // 现在面板改成自绘父子里表，依赖全部撤掉，APK 回到 ~0.5MB。
}
